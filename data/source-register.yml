# Structured source metadata for curated source selection.
# Keep this in sync with docs/catalog/sources.md as the project grows.

collection_policy:
  scope: curated-theory-and-criticism-reader
  out_of_scope:
    - broad-scraping
    - topic-crawling
    - unsupervised-harvesting
    - repository-dumps
  selection_rule: "A source needs an editorial reason before extraction or public promotion."

