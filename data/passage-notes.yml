  - id: gorgias-speech-as-force
    title: Speech As Force
    status: prototype
    source_mode: restricted paraphrase only
    rights_mode: private restricted note; public quotation pending edition review
    text_id: gorgias-encomium-helen
    text_title: Encomium of Helen
    thinker_slug: gorgias-of-leontini
    thinker: Gorgias of Leontini
    source_location: Norton anthology chunk pages 71-74; exact section pending review
    source_edition: Norton anthology extraction testbed; public-domain translation not yet selected
    tags:
      - rhetoric
      - persuasion
      - force
    constellation_ids:
      - rhetoric-and-force
    chapter_candidates:
      - chapters/01-methods.md
      - chapters/02-rupture-points.md
    paraphrase: >
      Speech is treated as an active force: it can alter judgment, affect bodies, and redirect how an event is understood after the fact.
    commentary: >
      This is the first anchor for the project because it makes interpretation historical action, not just description. A passage note here can connect rhetoric, blame, violence, memory, and political formation without needing to publish restricted source text.
    review_tasks:
      - Select a public-domain or otherwise usable translation before adding quotation.
      - Confirm exact section and line references against the chosen edition.
      - Compare the Norton page layout against the generated page records before treating the location as stable.

  - id: gorgias-helen-and-blame
    title: Helen And Blame
    status: prototype
    source_mode: restricted paraphrase only
    rights_mode: private restricted note; public quotation pending edition review
    text_id: gorgias-encomium-helen
    text_title: Encomium of Helen
    thinker_slug: gorgias-of-leontini
