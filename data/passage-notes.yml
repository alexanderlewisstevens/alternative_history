    paraphrase: >
      Persuasion appears as a technology of belief: it can make one version of reality feel compelling enough to govern judgment and action.
    commentary: >
      This passage note should become a bridge between classical rhetoric and the project's larger question about historical possibility. Counterfactual thinking depends on seeing how belief, plausibility, and narrative force organize what people take to be real.
