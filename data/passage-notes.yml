    source_location: Norton anthology chunk pages 71-74; exact section pending review
    source_edition: Norton anthology extraction testbed; public-domain translation not yet selected
    tags:
      - rhetoric
      - blame
      - agency
    constellation_ids:
      - rhetoric-and-force
    chapter_candidates:
      - chapters/00-start-here.md
      - chapters/03-erased-archives.md
    paraphrase: >
      Helen becomes a test case for how stories distribute responsibility. The passage asks whether blame changes when action is shaped by force, divine pressure, erotic compulsion, or persuasive speech.
    commentary: >
      This note is useful for alternative history because it treats a famous inherited narrative as something that can be reopened by argument. The point is not to excuse or condemn, but to see how causality is built by rhetorical framing.
    review_tasks:
      - Identify the exact argumentative sequence used to unsettle inherited blame.
      - Keep source notes and bibliography separate from the paraphrase.
      - Decide whether this belongs primarily in rhetoric, historiography, or memory work.

